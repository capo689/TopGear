<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Native selects</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
      label { display: block; margin: 0.75rem 0 0.15rem; font-weight: 600; }
      select { width: 100%; padding: 0.4rem; }
    </style>
  </head>
  <body>
    <h1>Native selects</h1>

    <label for="timezone">Timezone (with optgroups)</label>
    <select id="timezone" name="timezone">
      <optgroup label="Americas">
        <option value="pst">Pacific</option>
        <option value="mst">Mountain</option>
        <option value="est">Eastern</option>
      </optgroup>
      <optgroup label="Europe">
        <option value="gmt">GMT</option>
        <option value="cet">Central European</option>
      </optgroup>
    </select>

    <label for="plan">Plan (has a disabled option)</label>
    <select id="plan" name="plan">
      <option value="free">Free</option>
      <option value="pro">Pro</option>
      <option value="enterprise" disabled>Enterprise (contact sales)</option>
    </select>

    <label for="langs">Languages (multiple)</label>
    <select id="langs" name="langs" multiple size="4">
      <option value="en">English</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
    </select>
  </body>
</html>
