name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Browser suites (semantic-engine, browser-playwright, execution, daemon) need
      # Chromium. Install it before tests so they run in CI, not just locally.
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Test (unit + browser suites + fixture farm)
        run: pnpm test

      # The built MCP server end to end over stdio, exactly as an MCP client starts it.
      - name: Smoke test (MCP server over stdio)
        run: pnpm smoke
